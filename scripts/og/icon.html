<!doctype html>
<!-- Scales the 1024pt app-icon master to whatever window `npm run icons`
     renders it in. Chrome screenshots do not resize an image on their own. -->
<meta charset="utf-8">
<style>html, body { margin: 0; height: 100%; } img { display: block; width: 100vw; height: 100vh; }</style>
<img src="../../src/assets/img/appicon.svg" alt="">
