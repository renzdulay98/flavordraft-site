<!doctype html>
<!-- Source for src/assets/img/og.png, the 1200 × 630 share card. Rendered by
     `npm run icons`, which first replaces each pen marker below (a comment that
     names a mark) with that mark of the red pen from src/_data/pen.js, finished:
     the hero's ring and underline. Laid out with the site's own tokens and faces.
     The two devices are Cook View, photo-free, from the site's own image set
     (`npm run screens`): the campaign's iPhone Duo folded like a laptop and its
     dark iPhone. -->
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #fcf5ea url("../../src/assets/img/paper-grain.png") 0 0 / 48px 48px;
    background-blend-mode: multiply;
    font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; color: #2c2622;
  }
  .wordmark { position: absolute; left: 72px; top: 64px; width: 210px; }
  .words { position: absolute; left: 72px; top: 178px; }
  .news { display: block; font-size: 86px; font-weight: 800; line-height: 1.02; letter-spacing: -0.033em; }
  .made { display: block; margin-top: 0.42em; font-family: Charter, "Iowan Old Style", Georgia, serif; font-size: 50px; line-height: 1.12; letter-spacing: -0.012em; }
  .inked { position: relative; display: inline-block; white-space: nowrap; }
  .inked svg { position: absolute; overflow: visible; mix-blend-mode: multiply; }
  .inked svg path { fill: #ba2d29; }
  .ring { margin-inline: 0.22em 0.26em; }
  .ring svg { left: 50%; top: 41%; width: 2.42em; height: 1.27em; transform: translate(-50%, -50%); }
  .under svg { left: -0.03em; top: 94%; width: calc(100% + 0.08em); height: 0.3em; }
  .site { position: absolute; left: 72px; bottom: 58px; font-size: 22px; color: #7a6c60; }
  .shot { position: absolute; }
  .shot img { display: block; width: 100%; height: auto; }
  .duo { right: 150px; top: 118px; width: 470px; }
  .iphone { right: 56px; top: 212px; width: 132px; }
</style></head>
<body>
  <img class="wordmark" src="../../src/assets/img/wordmark-flavordraft.png" alt="">
  <p class="words">
    <span class="news">FlavorDraft<br><span class="inked ring">2.0<!--pen:ring--></span> is here.</span>
    <span class="made">Made for <span class="inked under">iPhone Duo<!--pen:underline--></span>.</span>
  </p>
  <p class="site">flavordraft.app</p>
  <div class="shot duo"><img src="../../src/assets/img/screens/cook-duo-960.webp" alt=""></div>
  <div class="shot iphone"><img src="../../src/assets/img/screens/cook-iphone-330.webp" alt=""></div>
</body></html>
